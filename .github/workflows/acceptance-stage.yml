name: Acceptance Stage
on:
  workflow_run:
    workflows: ['Commit Stage']
    types: [completed]

concurrency:
  group: acceptance-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env: 
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: ${{ github.sha }}

jobs:
  functional:
    name: Funtional Tests
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Running Functional tests"