name: Commit Stage
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

env: 
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sumni-finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: go.sum
      
      - name: Install taskfile
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/task/task/setup.deb.sh' | sudo -E bash
          sudo apt install task

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Test
        run: task test

      - name: Domain Coverage
        run: task domain-coverage
        continue-on-error: true

      - name: Build 
        run: go build -v ./...

      - uses: anchore/scan-action@v7
        id: scan
        with:
          path: "."
          fail-build: false
          severity-cutoff: high

      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  package:
    name: Package and Publish
    needs: [ build ]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} -f docker/app-prod/Dockerfile .

      - uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          fail-build: false
          severity-cutoff: high

      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      
      - name: Log into container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish contianer image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
      
      - name: Publish container image (latest)
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  
  publish-contract:
    name: Publish OpenAPI Contract
    needs: [ build ]
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'publish-contract')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      
      - name: Checkout frontend repo
        uses: actions/checkout@v6
        with:
          repository: quangbach27/sumni-finance-frontend-vite
          token: ${{ secrets.CONTRACT_REPO_TOKEN }}
          path: sumni-finance-frontend-vite
          persist-credentials: false
      
      - name: Copy OpenAPI spec
        run: |
          set -euo pipefail
          found=0
          find . -path "*/api/http/openapi.yaml" | while IFS= read -r file; do
            module=$(echo "$file" | awk -F'/' '{print $(NF-3)}')
            dest="sumni-finance-frontend-vite/src/api/$module"
            echo "Copying $file -> $dest/"
            mkdir -p "$dest"
            cp "$file" "$dest/openapi.yaml"
            found=$((found + 1))
          done
          echo "Done. Copied $found spec(s)."
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CONTRACT_REPO_TOKEN }}
          path: sumni-finance-frontend-vite
          commit-message: "chore: update openapi contract from sumni-finance-backend"
          branch: chore/update-openapi-contract-${{ github.event.pull_request.number }}
          title: "chore: update OpenAPI contract from PR #${{ github.event.pull_request.number }}"
          body: |
            Automated OpenAPI contract update from `sumni-finance-backend`.
            
            Source PR: ${{ github.event.pull_request.html_url }}
            Triggered by: @${{ github.actor }}