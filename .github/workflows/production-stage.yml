name: Production Stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (commit SHA) to deploy"
        required: true
        default: ${{ github.sha }}   # ← pre-fills latest SHA when button is clicked

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: ${{ github.event.inputs.version }}

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sumni-finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Log into container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Run container
        run: |
          docker run -d \
            --name sumni-finance-app \
            --network host \
            -e POSTGRES_URL="postgres://user:password@localhost:5432/sumni-finance?sslmode=disable" \
            -e PORT=4000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs sumni-finance-app
          exit 1

      - name: Test health endpoint
        run: curl -sf http://localhost:4000/health
