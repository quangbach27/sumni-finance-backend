name: Production Stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (commit SHA) — leave blank to use latest on this branch"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: ${{ github.event.inputs.version || github.sha }}

jobs:
  deploy:
    name: Deploy and Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment:
      name: production
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sumni-finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Start application
        run: |
          docker run -d \
            --name sumni-finance-app \
            -p 4000:4000 \
            -e POSTGRES_URL="postgres://user:password@localhost:5432/sumni-finance?sslmode=disable" \
            -e PORT=4000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs sumni-finance-app
          exit 1

      - name: Smoke test
        run: |
          curl -sf http://localhost:4000/health
