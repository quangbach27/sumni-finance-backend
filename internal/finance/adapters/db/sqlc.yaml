version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "dbmodels"
        out: "dbmodels"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # Map nullable timestamptz to *time.Time (pointer for nil handling).
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # Map non-nullable timestamptz to time.Time.
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"

          - db_type: "uuid"
            nullable: false
            go_type:
              import: "sumni-finance-backend/internal/common"
              type: "UUID"

          # finances.offices
          - column: "finances.offices.office_uuid"
            go_type:
              import: "sumni-finance-backend/internal/finance/app/models"
              type: "OfficeUUID"

          # finances.fund_providers
          - column: "finances.fund_providers.fund_provider_uuid"
            go_type:
              import: "sumni-finance-backend/internal/finance/domain"
              type: "FundProviderUUID"

          - column: "finances.fund_providers.currency"
            go_type:
              import: "sumni-finance-backend/internal/common/shared"
              type: "Currency"

          - column: "finances.fund_providers.fund_provider_type"
            go_type:
              import: "sumni-finance-backend/internal/finance/domain"
              type: "FundProviderType"

          - column: "finances.fund_providers.office_uuid"
            go_type:
              import: "sumni-finance-backend/internal/finance/app/models"
              type: "OfficeUUID"

          # finances.wallets
          - column: "finances.wallets.wallet_uuid"
            go_type:
              import: "sumni-finance-backend/internal/finance/domain"
              type: "WalletUUID"

          - column: "finances.wallets.currency"
            go_type:
              import: "sumni-finance-backend/internal/common/shared"
              type: "Currency"

          - column: "finances.wallets.office_uuid"
            go_type:
              import: "sumni-finance-backend/internal/finance/app/models"
              type: "OfficeUUID"

          # finances.wallet_allocations
          - column: "finances.wallet_allocations.wallet_uuid"
            go_type:
              import: "sumni-finance-backend/internal/finance/domain"
              type: "WalletUUID"

          - column: "finances.wallet_allocations.fund_provider_uuid"
            go_type:
              import: "sumni-finance-backend/internal/finance/domain"
              type: "FundProviderUUID"
