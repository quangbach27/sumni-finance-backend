version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "dbmodels"
        out: "dbmodels"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "uuid"
            nullable: false
            go_type:
              import: "sumni-finance-backend/internal/common"
              type: "UUID"

          - db_type: "uuid"
            nullable: true
            go_type:
              import: "sumni-finance-backend/internal/common"
              type: "UUID"
              pointer: true
          
          # identities.sessions
          - column: "identities.sessions.session_id"
            go_type:
              import: "sumni-finance-backend/internal/identity/app/models"
              type: "SessionID"