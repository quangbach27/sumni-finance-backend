openapi: "3.0.0"
info:
  version: 1.0.0
  title: Treasury
servers:
  - url: https://{hostname}/treasury
    variables:
      hostname:
        default: localhost
paths:
  /v1/treasury/fund-sources:
    get:
      summary: List all fund sources
      operationId: listFundSources
      tags:
        - fund-sources
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of fund sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFundSourcesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new fund source
      operationId: createFundSource
      tags:
        - fund-sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFundSourceRequest'
      responses:
        '201':
          description: Treasury registered succefully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFundSourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Treasury already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/treasury/wallets:
    get:
      summary: List all wallets
      operationId: listWallets
      tags:
        - wallets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWalletsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a wallet
      operationId: createWallet
      tags:
        - wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Wallet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWalletResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Wallet already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/treasury/wallets/{wallet_uuid}/fund-sources:
    post:
      summary: Link fund sources to a wallet
      operationId: linkFundSources
      tags:
        - wallets
      parameters:
        - name: wallet_uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/WalletUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkFundSourcesRequest'
      responses:
        '204':
          description: Fund sources linked successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Pagination:
      type: object
      required:
        - total
        - page
        - page_size
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    ListFundSourcesResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FundSourceResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

    FundSourceResponse:
      type: object
      required:
        - fund_source_uuid
        - name
        - source_type
        - balance
        - available_balance
        - currency
      properties:
        fund_source_uuid:
          $ref: '#/components/schemas/FundSourceUUID'
        name:
          type: string
        source_type:
          $ref: '#/components/schemas/FundSourceType'
        balance:
          $ref: '#/components/schemas/Decimal'
        available_balance:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
        bank_metadata:
          $ref: '#/components/schemas/FundSourceBankMetadataResponse'
          nullable: true
        cash_metadata:
          $ref: '#/components/schemas/FundSourceCashMetadataResponse'
          nullable: true

    FundSourceBankMetadataResponse:
      type: object
      required:
        - bank_name
        - bank_code
        - bank_short_name
        - bank_bin
        - bank_logo_url
        - bank_icon_url
        - account_number
        - account_owner
      properties:
        bank_name:
          type: string
        bank_code:
          type: string
        bank_short_name:
          type: string
        bank_bin:
          type: integer
        bank_logo_url:
          type: string
        bank_icon_url:
          type: string
        account_number:
          type: string
        account_owner:
          type: string

    FundSourceCashMetadataResponse:
      type: object
      required:
        - owner_name
      properties:
        owner_name:
          type: string

    CreateFundSourceRequest:
      type: object
      required:
        - name
        - source_type
        - init_balance
        - currency
        - metadata
      properties:
        name:
          type: string
        source_type:
          $ref: '#/components/schemas/FundSourceType'
        init_balance:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
        metadata:
          $ref: '#/components/schemas/FundSourceMetadata'

    CreateFundSourceResponse:
      type: object
      required:
        - fund_source_uuid
      properties:
        fund_source_uuid:
          $ref: '#/components/schemas/FundSourceUUID'

    CreateWalletRequest:
      type: object
      required:
        - name
        - currency
      properties:
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/CreateWalletAllocationRequest'

    ListWalletsResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

    WalletResponse:
      type: object
      required:
        - wallet_uuid
        - name
        - currency
        - balance
        - allocations
      properties:
        wallet_uuid:
          $ref: '#/components/schemas/WalletUUID'
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        balance:
          $ref: '#/components/schemas/Decimal'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/WalletAllocationResponse'

    WalletAllocationResponse:
      type: object
      required:
        - fund_source_uuid
        - fund_source_name
        - balance
      properties:
        fund_source_uuid:
          $ref: '#/components/schemas/FundSourceUUID'
        fund_source_name:
          type: string
        balance:
          $ref: '#/components/schemas/Decimal'

    CreateWalletAllocationRequest:
      type: object
      required:
        - fund_source_uuid
        - allocated_balance
      properties:
        fund_source_uuid:
          $ref: '#/components/schemas/FundSourceUUID'
        allocated_balance:
          $ref: '#/components/schemas/Decimal'

    CreateWalletResponse:
      type: object
      required:
        - wallet_uuid
      properties:
        wallet_uuid:
          $ref: '#/components/schemas/WalletUUID'

    LinkFundSourcesRequest:
      type: object
      required:
        - allocations
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/LinkFundSourceAllocationRequest'

    LinkFundSourceAllocationRequest:
      type: object
      required:
        - fund_source_uuid
        - allocated_amount
      properties:
        fund_source_uuid:
          $ref: '#/components/schemas/FundSourceUUID'
        allocated_amount:
          $ref: '#/components/schemas/Decimal'

    Decimal:
      type: string
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal

    Currency:
      type: string
      x-go-type: shared.Currency
      x-go-type-import:
        path: sumni-finance-backend/internal/common/shared

    FundSourceUUID:
      type: string
      format: uuid
      description: UUID of a fund source
      x-go-type: domain.FundSourceUUID
      x-go-type-import:
        path: sumni-finance-backend/internal/treasury/domain

    FundSourceType:
      type: string
      description: Fund source type (CASH || BANK)
      x-go-type: domain.FundSourceType
      x-go-type-import:
        path: sumni-finance-backend/internal/treasury/domain

    EntryType:
      type: string
      description: Journal entry type (DEBIT || CREDIT)
      x-go-type: shared.EntryType
      x-go-type-import:
        path: sumni-finance-backend/internal/common/shared

    WalletUUID:
      type: string
      format: uuid
      description: UUID of a wallet
      x-go-type: domain.WalletUUID
      x-go-type-import:
        path: sumni-finance-backend/internal/treasury/domain

    FundSourceMetadata:
      type: object
      properties:
        bank_metadata:
          $ref: "#/components/schemas/FundSourceBankMetadata"
        cash_metadata:
          $ref: '#/components/schemas/FundSourceCashMetadata'

    FundSourceBankMetadata:
      type: object
      required:
        - bank_code
        - account_number
        - account_owner
      properties:
        bank_code:
          type: string
        account_number:
          type: string
        account_owner:
          type: string

    FundSourceCashMetadata:
      type: object
      required:
        - owner_name
      properties:
        owner_name:
          type: string

    ErrorResponse:
      type: object
      required:
        - slug
        - message
        - details
      properties:
        slug:
          type: string
          description: Error slug
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          description: Detailed error information
          items:
            $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      type: object
      required:
        - error_slug
        - message
      properties:
        entity_type:
          type: string
        entity_id:
          type: string
        error_slug:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
